name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SnowRunnerTuningShop.slnx

      - name: Build
        run: dotnet build SnowRunnerTuningShop.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/SnowRunnerTuningShop.Tests/SnowRunnerTuningShop.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish smoke (win-x64 self-contained)
        run: >
          dotnet publish src/SnowRunnerTuningShop/SnowRunnerTuningShop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/smoke

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Desktop
        run: dotnet restore src/SnowRunnerTuningShop.Desktop/SnowRunnerTuningShop.Desktop.csproj

      - name: Build Desktop
        run: dotnet build src/SnowRunnerTuningShop.Desktop/SnowRunnerTuningShop.Desktop.csproj -c Release --no-restore

      - name: Publish smoke (linux-x64 self-contained)
        run: >
          dotnet publish src/SnowRunnerTuningShop.Desktop/SnowRunnerTuningShop.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -o publish/linux-smoke
