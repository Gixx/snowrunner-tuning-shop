name: Release

# Windows: WPF self-contained + Inno Setup (+ portable zip).
# Linux: Avalonia Desktop portable zip + Flatpak bundle.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          # Stable: 1.4.2 — Beta: 1.4.2-beta.1 (numbered prereleases only)
          if ($version -notmatch '^\d+\.\d+\.\d+(-beta\.\d+)?$') {
            throw "Tag must look like v1.0.0 or v1.0.0-beta.1 (got $tag)"
          }
          $isPrerelease = $version -match '-beta\.'
          $numericVersion = ($version -split '-')[0]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "numeric=$numericVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify AppInfo.Version matches tag
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $appInfoPath = "src/SnowRunnerTuningShop.Core/AppInfo.cs"
          $text = Get-Content -Path $appInfoPath -Raw
          if ($text -notmatch 'public const string Version = "(?<ver>[^"]+)"') {
            throw "Could not parse AppInfo.Version from $appInfoPath"
          }
          $actual = $Matches['ver']
          if ($actual -ne $expected) {
            throw "AppInfo.Version ($actual) does not match release tag version ($expected). Bump AppInfo.cs before tagging."
          }
          Write-Host "AppInfo.Version matches tag: $actual"

      - name: Restore
        run: dotnet restore SnowRunnerTuningShop.slnx

      - name: Inject Mailtrap API token
        shell: pwsh
        env:
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MAILTRAP_API_TOKEN)) {
            throw "Repository secret MAILTRAP_API_TOKEN is missing. Add it under Settings → Secrets and variables → Actions."
          }
          if ($env:MAILTRAP_API_TOKEN.StartsWith("PASTE_")) {
            throw "MAILTRAP_API_TOKEN still looks like a placeholder."
          }
          $path = "src/SnowRunnerTuningShop.Core/Diagnostics/BugReportSecrets.Local.cs"
          # Escape for a C# verbatim-ish string literal (token should be alphanumeric; still escape quotes/backslashes).
          $token = $env:MAILTRAP_API_TOKEN.Replace('\', '\\').Replace('"', '\"')
          $content = @"
          namespace SnowRunnerTuningShop.Core.Diagnostics;

          public static partial class BugReportSecrets
          {
              public const string MailtrapApiToken = "$token";
          }
          "@
          # Trim accidental leading spaces from each line of the here-string.
          $content = ($content -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          Set-Content -Path $path -Value $content -Encoding utf8
          Write-Host "Wrote $path for release build."

      - name: Test
        run: dotnet test tests/SnowRunnerTuningShop.Tests/SnowRunnerTuningShop.Tests.csproj -c Release --verbosity normal

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish src/SnowRunnerTuningShop/SnowRunnerTuningShop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.numeric }}
          -p:InformationalVersion=${{ steps.version.outputs.tag }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/SnowRunnerTuningShop-win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after Inno Setup install"
          }
          & $iscc `
            "installer\SnowRunnerTuningShop.iss" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyAppTag=${{ steps.version.outputs.tag }}"
          $name = "SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-win-x64-Setup.exe"
          $path = Join-Path "publish" $name
          if (-not (Test-Path $path)) {
            throw "Installer was not produced: $path"
          }
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Zip portable (optional)
        id: zip
        shell: pwsh
        run: |
          $name = "SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path "publish/SnowRunnerTuningShop-win-x64/*" -DestinationPath "publish/$name" -Force
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-win-x64
          path: |
            publish/${{ steps.installer.outputs.asset }}
            publish/${{ steps.zip.outputs.asset }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SnowRunner Tuning Shop ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            publish/${{ steps.installer.outputs.asset }}
            publish/${{ steps.zip.outputs.asset }}
          body: |
            ## SnowRunner Tuning Shop ${{ steps.version.outputs.tag }}

            Beta tags (`v*-beta.N`) are published as GitHub prereleases; Stable-channel users are not notified.

            ### Windows (recommended)
            1. Download `SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-win-x64-Setup.exe`
            2. Run the installer
            3. Launch **SnowRunner Tuning Shop** from the Start menu

            Self-contained win-x64 (no separate .NET install). Portable `.zip` is the same build without the installer.

            ### Linux (preview)
            - **Flatpak (recommended):** `SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-linux-x64.flatpak`
              ```
              flatpak install --user SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-linux-x64.flatpak
              flatpak run io.github.gixx.SnowRunnerTuningShop
              ```
            - **Portable zip:** extract `SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-linux-x64.zip` and run `SnowRunnerTuningShop.Desktop`.

            Avalonia UI preview. Close SnowRunner (including Proton) before writing `initial.pak`.
            Home filesystem access is enabled so Steam paths under `~` work; use Flatseal for libraries outside `$HOME`.
            Needs X11/XWayland (`--socket=x11`); Wayland-only without X11 will not start.

            See the README for baseline setup and tuning tips.

            **Note:** Windows builds are not Authenticode-signed. SmartScreen may warn on first run — choose **More info → Run anyway** if prompted.

  linux:
    name: Linux release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Tag must look like v1.0.0 or v1.0.0-beta.1 (got $tag)" >&2
            exit 1
          fi
          numeric="${version%%-*}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify AppInfo.Version matches tag
        shell: bash
        run: |
          expected="${{ steps.version.outputs.version }}"
          actual=$(sed -n 's/.*public const string Version = "\([^"]*\)".*/\1/p' src/SnowRunnerTuningShop.Core/AppInfo.cs | head -n1)
          if [[ -z "$actual" ]]; then
            echo "Could not parse AppInfo.Version" >&2
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "AppInfo.Version ($actual) does not match release tag version ($expected)." >&2
            exit 1
          fi
          echo "AppInfo.Version matches tag: $actual"

      - name: Inject Mailtrap API token
        shell: bash
        env:
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
        run: |
          if [[ -z "${MAILTRAP_API_TOKEN// }" ]]; then
            echo "Repository secret MAILTRAP_API_TOKEN is missing." >&2
            exit 1
          fi
          if [[ "$MAILTRAP_API_TOKEN" == PASTE_* ]]; then
            echo "MAILTRAP_API_TOKEN still looks like a placeholder." >&2
            exit 1
          fi
          path="src/SnowRunnerTuningShop.Core/Diagnostics/BugReportSecrets.Local.cs"
          token="${MAILTRAP_API_TOKEN//\\/\\\\}"
          token="${token//\"/\\\"}"
          cat > "$path" <<EOF
          namespace SnowRunnerTuningShop.Core.Diagnostics;

          public static partial class BugReportSecrets
          {
              public const string MailtrapApiToken = "$token";
          }
          EOF
          # Strip accidental leading spaces from the heredoc lines.
          sed -i 's/^[[:space:]]*//' "$path"
          echo "Wrote $path for release build."

      - name: Restore Desktop
        run: dotnet restore src/SnowRunnerTuningShop.Desktop/SnowRunnerTuningShop.Desktop.csproj

      - name: Publish linux-x64 (self-contained)
        run: >
          dotnet publish src/SnowRunnerTuningShop.Desktop/SnowRunnerTuningShop.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.numeric }}
          -p:InformationalVersion=${{ steps.version.outputs.tag }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/SnowRunnerTuningShop-linux-x64

      - name: Zip portable
        id: zip
        shell: bash
        run: |
          name="SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-linux-x64.zip"
          (cd publish/SnowRunnerTuningShop-linux-x64 && zip -r "../$name" .)
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak bundle
        id: flatpak
        shell: bash
        run: |
          mkdir -p packaging/flatpak/publish
          rm -rf packaging/flatpak/publish/*
          cp -a publish/SnowRunnerTuningShop-linux-x64/. packaging/flatpak/publish/
          chmod +x packaging/flatpak/publish/SnowRunnerTuningShop.Desktop || true
          # Keep AppStream <release> in sync with the tag (incl. beta).
          meta="packaging/flatpak/io.github.gixx.SnowRunnerTuningShop.metainfo.xml"
          date_utc="$(date -u +%Y-%m-%d)"
          sed -i -E "s|<release version=\"[^\"]*\" date=\"[^\"]*\"/>|<release version=\"${{ steps.version.outputs.version }}\" date=\"${date_utc}\"/>|" "$meta"
          name="SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-linux-x64.flatpak"
          (
            cd packaging/flatpak
            flatpak-builder --user --force-clean --repo=repo build io.github.gixx.SnowRunnerTuningShop.yml
            flatpak build-bundle repo "../../publish/$name" io.github.gixx.SnowRunnerTuningShop
          )
          test -f "publish/$name"
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-linux-x64
          path: |
            publish/${{ steps.zip.outputs.asset }}
            publish/${{ steps.flatpak.outputs.asset }}

      - name: Attach Linux assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            publish/${{ steps.zip.outputs.asset }}
            publish/${{ steps.flatpak.outputs.asset }}
