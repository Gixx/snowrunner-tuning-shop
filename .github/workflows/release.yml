name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Tag must look like v1.0.0 (got $tag)"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish src/SnowRunnerTuningShop/SnowRunnerTuningShop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.tag }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/SnowRunnerTuningShop-win-x64

      - name: Zip release
        shell: pwsh
        run: |
          $name = "SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path "publish/SnowRunnerTuningShop-win-x64/*" -DestinationPath "publish/$name" -Force
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerTuningShop-${{ steps.version.outputs.tag }}-win-x64
          path: publish/${{ steps.zip.outputs.asset }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SnowRunner Tuning Shop ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: publish/${{ steps.zip.outputs.asset }}
          body: |
            ## SnowRunner Tuning Shop ${{ steps.version.outputs.tag }}

            Windows x64 **self-contained** build (no separate .NET install required).

            1. Download the zip
            2. Extract
            3. Run `SnowRunnerTuningShop.exe`

            See the README for baseline setup and tuning tips.

            **Note:** This build is not Authenticode-signed. Windows Smart App Control / SmartScreen may warn on first run.
